services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guardpulse
      POSTGRES_USER: guardpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/guardpulse
DB_USERNAME: guardpulse
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}

      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_ADMIN_ADDRESS: ${MAIL_ADMIN_ADDRESS}

      PAYFAST_SANDBOX: ${PAYFAST_SANDBOX:-false}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE}
      PAYFAST_RETURN_URL: https://${DOMAIN}/order
      PAYFAST_CANCEL_URL: https://${DOMAIN}/order
      PAYFAST_NOTIFY_URL: https://${DOMAIN}/api/payments/payfast/itn

      CORS_ALLOWED_ORIGINS: https://${DOMAIN}

      STORE_VAT_NUMBER: ${STORE_VAT_NUMBER}
      STORE_VAT_RATE_PERCENT: ${STORE_VAT_RATE_PERCENT:-15}
      STORE_PRICES_INCLUDE_VAT: ${STORE_PRICES_INCLUDE_VAT:-true}

      RATELIMIT_PER_MINUTE: ${RATELIMIT_PER_MINUTE:-60}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  edge:
    build:
      context: .
      dockerfile: deploy/Dockerfile.edge
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. shop.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  uploads-data:
  caddy-data:
  caddy-config:
