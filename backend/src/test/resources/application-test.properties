# Isolated in-memory database for tests — never touches the dev H2 file or a real Postgres.
spring.datasource.url=jdbc:h2:mem:ai-smart-camera-security-test;NON_KEYWORDS=KEY;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.h2.console.enabled=false

mail.enabled=false