spring.application.name=guardpulse

# Dev database: file-based H2 (zero setup, persists between restarts in ./data/guardpulse.mv.db)
spring.datasource.url=jdbc:h2:file:./data/guardpulse;AUTO_SERVER=TRUE;NON_KEYWORDS=KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway only runs in the "prod" profile (see application-prod.properties) — the dev H2
# database is managed by Hibernate's auto-DDL (ddl-auto=update) above instead.
spring.flyway.enabled=false

# H2 console at http://localhost:8000/h2-console (dev only — disable in production)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Use snake_case JSON field names (is_bundle, stock_qty, full_name, etc.) to match
# what the React frontend expects
spring.jackson.property-naming-strategy=SNAKE_CASE

server.port=${PORT:8000}

# Behind Render / Caddy / any HTTPS proxy: trust X-Forwarded-* so redirects (admin login!)
# and absolute URLs use https instead of http.
server.forward-headers-strategy=framework

# Public URL of the storefront. Used to build links in emails (e.g. password reset).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# ---------------------------------------------------------------------------
# Admin back-office (http://localhost:8000/admin/)
# CHANGE ADMIN_USERNAME before deploying anywhere reachable from the internet.
# Leave ADMIN_PASSWORD unset and a secure random password is generated at startup
# and printed to the log once — see SecurityConfig. Set ADMIN_PASSWORD explicitly
# once you're ready to log in reliably across restarts.
# ---------------------------------------------------------------------------
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}

# ---------------------------------------------------------------------------
# Emails (order confirmation, payment received, password reset, merchant alerts).
# mail.enabled=false logs emails to the console instead of sending them (dev default).
# mail.enabled=true sends through Resend over HTTPS (ResendMailService). Render's free
# tier blocks SMTP ports, so SMTP will NOT work there.
# mail.from must be an address on a domain verified in Resend (guardpulse.co.za).
# ---------------------------------------------------------------------------
mail.enabled=${MAIL_ENABLED:true}
mail.from=${MAIL_FROM:noreply@guardpulse.co.za}
mail.admin-address=${MAIL_ADMIN_ADDRESS:admin@guardpulse.co.za}
resend.api-key=${RESEND_API_KEY:}

# Optional: only used if you set MAIL_PROVIDER=smtp (activates SmtpMailService), e.g. on a
# host that allows outbound SMTP. Not used by default.
mail.provider=${MAIL_PROVIDER:resend}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------------------------------------------------------------------
# Product photo uploads via the admin panel, served back out at /media/**
# NOTE: Render's free tier has an ephemeral disk — uploaded files vanish on redeploy.
# Prefer the "image URL" field in the admin product form.
# ---------------------------------------------------------------------------
uploads.dir=${UPLOADS_DIR:./uploads}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# ---------------------------------------------------------------------------
# PayFast payment gateway (https://developers.payfast.co.za)
# Sandbox defaults below are PayFast's own published test-merchant credentials —
# safe to commit, but they don't move real money.
# For live: set PAYFAST_SANDBOX=false and PAYFAST_MERCHANT_ID / PAYFAST_MERCHANT_KEY /
# PAYFAST_PASSPHRASE as Render environment variables. NEVER commit real credentials.
# ---------------------------------------------------------------------------
payfast.sandbox=${PAYFAST_SANDBOX:true?}
payfast.merchant-id=${PAYFAST_MERCHANT_ID:1684103}
payfast.merchant-key=${PAYFAST_MERCHANT_KEY:jjid52zutfz4}
payfast.passphrase=${PAYFAST_PASSPHRASE:I love music}
# Where the customer's browser returns to after paying/cancelling (frontend route)
payfast.return-url=${PAYFAST_RETURN_URL:http://localhost:5173/order}
payfast.cancel-url=${PAYFAST_CANCEL_URL:http://localhost:5173/order}
# Where PayFast POSTs the server-to-server payment confirmation (this backend)
payfast.notify-url=${PAYFAST_NOTIFY_URL:http://localhost:8000/api/payments/payfast/itn}

# ---------------------------------------------------------------------------
# Rate limiting (requests per minute per IP) on cart/checkout endpoints —
# see config/RateLimitFilter.java
# ---------------------------------------------------------------------------
ratelimit.requests-per-minute=${RATELIMIT_PER_MINUTE:60}

# ---------------------------------------------------------------------------
# Shipping (see shipping/ShippingRates.java, shipping/ShippingService.java)
# Weight-tiered, computed server-side at checkout from the cart's real weight —
# the client can never override this. These are estimates, not quoted courier
# prices; they will be replaced/backed by live Courier Guy (Ship Logic) rates.
# ---------------------------------------------------------------------------
shipping.tier1-max-kg=${SHIPPING_TIER1_MAX_KG:1}
shipping.tier1-fee=${SHIPPING_TIER1_FEE:110}
shipping.tier2-max-kg=${SHIPPING_TIER2_MAX_KG:3}
shipping.tier2-fee=${SHIPPING_TIER2_FEE:145}
shipping.tier3-max-kg=${SHIPPING_TIER3_MAX_KG:5}
shipping.tier3-fee=${SHIPPING_TIER3_FEE:175}
shipping.tier4-max-kg=${SHIPPING_TIER4_MAX_KG:10}
shipping.tier4-fee=${SHIPPING_TIER4_FEE:220}
shipping.over-tier4-rate-per-kg=${SHIPPING_OVER_TIER4_RATE:15}

# ---------------------------------------------------------------------------
# Production database: see application-prod.properties for the Postgres +
# Flyway setup. Run with SPRING_PROFILES_ACTIVE=prod to use it instead of H2.
# ---------------------------------------------------------------------------