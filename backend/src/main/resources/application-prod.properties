# ---------------------------------------------------------------------------
# Production profile — activate with SPRING_PROFILES_ACTIVE=prod (or
# --spring.profiles.active=prod). Values here override application.properties.
# ---------------------------------------------------------------------------

# --- Database: Postgres, managed by Flyway migrations (src/main/resources/db/migration) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/guardpulse}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:guardpulse}
spring.datasource.password=${DB_PASSWORD:}

# Never let Hibernate touch the schema in production — Flyway migrations are the only
# thing allowed to change it. If this says anything's out of sync, write a migration;
# don't let this auto-fix it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Dev-only tools that must never be reachable in production ---
spring.h2.console.enabled=false
spring.devtools.restart.enabled=false

# --- Public URLs ---
app.frontend-url=${APP_FRONTEND_URL:https://guardpulse.co.za}

# --- CORS: your real frontend domains (see config/CorsConfig.java) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://guardpulse.co.za,https://www.guardpulse.co.za}

# --- Email: on by default in production (sends via Resend; needs RESEND_API_KEY) ---
mail.enabled=${MAIL_ENABLED:true}

# --- Everything else (PayFast, mail addresses, admin credentials, rate limiting) is read
# from environment variables as documented in application.properties — set real
# values for PAYFAST_*, RESEND_API_KEY, MAIL_*, ADMIN_* on Render. ---