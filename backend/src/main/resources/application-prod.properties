# ---------------------------------------------------------------------------
# Production profile — activate with SPRING_PROFILES_ACTIVE=prod (or
# --spring.profiles.active=prod). Values here override application.properties.
# ---------------------------------------------------------------------------

# --- Database: Postgres, managed by Flyway migrations (src/main/resources/db/migration) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/guardpulse}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:guardpulse}
spring.datasource.password=${DB_PASSWORD:}

# Never let Hibernate touch the schema in production — Flyway migrations are the only
# thing allowed to change it. If this says anything's out of sync, write a migration;
# don't let this auto-fix it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Dev-only tools that must never be reachable in production ---
spring.h2.console.enabled=false
spring.devtools.restart.enabled=false

# --- CORS: replace with your real frontend domain (see config/CorsConfig.java) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://aismartcamerasecurity.netlify.app}

# --- Everything else (PayFast, mail, admin credentials, rate limiting) is still
# read from environment variables as documented in application.properties — set real
# values for all of PAYFAST_*, SMTP_*, MAIL_*, ADMIN_* there. ---