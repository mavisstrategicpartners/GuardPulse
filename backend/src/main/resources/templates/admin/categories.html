<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categories — GuardPulse admin</title>
    <th:block th:replace="admin/fragments :: styles"></th:block>
</head>
<body>
    <div th:replace="admin/fragments :: nav('products')"></div>
    <div class="wrap" style="max-width:560px;">
        <p class="muted"><a href="/admin/products">← All products</a></p>
        <h1>Categories</h1>
        <p th:if="${param.created}" class="notice">Category added.</p>
        <p th:if="${param.keyTaken}" class="error-msg">That key is already in use — pick a different one.</p>

        <table style="margin-bottom:24px;">
            <tr><th>Label</th><th>Key</th><th>Sort order</th></tr>
            <tr th:each="c : ${categories}">
                <td th:text="${c.label}"></td>
                <td th:text="${c.key}"></td>
                <td th:text="${c.sortOrder}"></td>
            </tr>
        </table>

        <div class="card">
            <strong>Add a category</strong>
            <form method="post" th:action="@{/admin/categories}" style="margin-top:14px;">
                <label for="label">Label (shown to customers)</label>
                <input type="text" id="label" name="label" required placeholder="e.g. Smart Locks">

                <label for="key">Key (used internally, no spaces)</label>
                <input type="text" id="key" name="key" required placeholder="e.g. smart-locks">

                <label for="sortOrder">Sort order</label>
                <input type="number" id="sortOrder" name="sortOrder" value="0">

                <button type="submit" class="primary">Add category</button>
            </form>
        </div>
    </div>
</body>
</html>
