<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orders — GuardPulse admin</title>
    <th:block th:replace="admin/fragments :: styles"></th:block>
</head>
<body>
    <div th:replace="admin/fragments :: nav('orders')"></div>
    <div class="wrap">
        <h1>Orders</h1>
        <table>
            <tr><th>Reference</th><th>Date</th><th>Customer</th><th>Status</th><th>Total</th><th></th></tr>
            <tr th:each="o : ${orders}">
                <td th:text="${#strings.substring(o.reference.toString(), 0, 8)} + '…'"></td>
                <td th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy HH:mm')}"></td>
                <td th:text="${o.fullName} + ' — ' + ${o.email}"></td>
                <td><span th:class="'badge badge-' + ${o.status.name().toLowerCase()}" th:text="${o.status}"></span></td>
                <td th:text="'R' + ${o.total}"></td>
                <td><a th:href="@{'/admin/orders/' + ${o.id}}">View →</a></td>
            </tr>
            <tr th:if="${orders.isEmpty()}"><td colspan="6" class="muted">No orders yet.</td></tr>
        </table>
    </div>
</body>
</html>
