<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GuardPulse admin — log in</title>
    <th:block th:replace="admin/fragments :: styles"></th:block>
</head>
<body>
    <div class="login-box">
        <h1 style="font-size:20px;">GuardPulse admin</h1>
        <p th:if="${param.error}" class="error-msg">Incorrect username or password.</p>
        <p th:if="${param.logout}" class="muted" style="margin-bottom:16px;">You've been logged out.</p>
        <form method="post" th:action="@{/admin/login}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="submit" class="primary" style="width:100%;">Log in</button>
        </form>
    </div>
</body>
</html>
