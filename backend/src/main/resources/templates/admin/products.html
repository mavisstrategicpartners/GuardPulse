<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products — GuardPulse admin</title>
    <th:block th:replace="admin/fragments :: styles"></th:block>
</head>
<body>
    <div th:replace="admin/fragments :: nav('products')"></div>
    <div class="wrap">
        <h1>Products</h1>
        <table>
            <tr><th></th><th>Name</th><th>Brand</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr>
            <tr th:each="p : ${products}">
                <td style="width:48px;">
                    <img th:if="${p.imageUrl}" th:src="${p.imageUrl}" alt=""
                         style="width:40px;height:40px;object-fit:contain;background:var(--paper);">
                </td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.brand}"></td>
                <td th:text="${p.category.label}"></td>
                <td th:text="'R' + ${p.price}"></td>
                <td>
                    <span th:if="${p.stockQty lt 5}" class="badge badge-low" th:text="${p.stockQty}"></span>
                    <span th:unless="${p.stockQty lt 5}" th:text="${p.stockQty}"></span>
                </td>
                <td th:text="${p.active} ? 'Yes' : 'No'"></td>
                <td><a th:href="@{'/admin/products/' + ${p.id} + '/edit'}">Edit →</a></td>
            </tr>
        </table>
    </div>
</body>
</html>
