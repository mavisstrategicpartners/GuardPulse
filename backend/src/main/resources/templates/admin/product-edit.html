<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit product — GuardPulse admin</title>
    <th:block th:replace="admin/fragments :: styles"></th:block>
</head>
<body>
    <div th:replace="admin/fragments :: nav('products')"></div>
    <div class="wrap" style="max-width:560px;">
        <p class="muted"><a href="/admin/products">← All products</a></p>
        <h1 th:text="${product.name}"></h1>

        <div class="card" th:if="${product.imageUrl}">
            <img th:src="${product.imageUrl}" alt="" style="max-width:100%; display:block;">
        </div>

        <form method="post" th:action="@{'/admin/products/' + ${product.id}}" enctype="multipart/form-data" class="card">
            <label for="price">Price (R)</label>
            <input type="number" step="0.01" id="price" name="price" th:value="${product.price}" required>

            <label for="stockQty">Stock quantity</label>
            <input type="number" id="stockQty" name="stockQty" th:value="${product.stockQty}" required>

            <label for="weightKg">Shipping weight (kg)</label>
<input type="number" step="0.01" min="0" id="weightKg" name="weightKg" th:value="${product.weightKg}" required>
<p class="muted" style="margin:-10px 0 16px;">
    Boxed weight incl. packaging — used to calculate the shipping fee at checkout.
</p>

            <div class="checkbox-row">
                <input type="checkbox" id="active" name="active" th:checked="${product.active}">
                <label for="active" style="margin:0;">Active (visible in the store)</label>
            </div>

            <label for="image">Replace product photo</label>
            <input type="file" id="image" name="image" accept="image/*">
            <p class="muted" style="margin:-10px 0 16px;">Leave blank to keep the current photo.</p>

            <button type="submit" class="primary">Save changes</button>
        </form>
    </div>
</body>
</html>
