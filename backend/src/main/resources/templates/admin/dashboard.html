<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard — GuardPulse admin</title>
    <th:block th:replace="admin/fragments :: styles"></th:block>
</head>
<body>
    <div th:replace="admin/fragments :: nav('dashboard')"></div>
    <div class="wrap">
        <h1>Dashboard</h1>

        <div class="stat-grid">
            <div class="stat">
                <div class="label">Orders</div>
                <div class="value" th:text="${orderCount}">0</div>
            </div>
            <div class="stat">
                <div class="label">Revenue (paid orders)</div>
                <div class="value" th:text="'R' + ${#numbers.formatDecimal(revenue, 1, 0)}">R0</div>
            </div>
            <div class="stat">
                <div class="label">Registered customers</div>
                <div class="value" th:text="${customerCount}">0</div>
            </div>
            <div class="stat">
                <div class="label">Products low on stock (&lt;5)</div>
                <div class="value" th:text="${lowStock.size()}">0</div>
            </div>
        </div>

        <div class="card" th:if="${!lowStock.isEmpty()}">
            <strong>Low stock</strong>
            <table style="margin-top:12px;">
                <tr><th>Product</th><th>Stock left</th><th></th></tr>
                <tr th:each="p : ${lowStock}">
                    <td th:text="${p.name}"></td>
                    <td><span class="badge badge-low" th:text="${p.stockQty}"></span></td>
                    <td><a th:href="@{'/admin/products/' + ${p.id} + '/edit'}">Restock →</a></td>
                </tr>
            </table>
        </div>

        <div class="card">
            <strong>Recent orders</strong>
            <table style="margin-top:12px;">
                <tr><th>Reference</th><th>Customer</th><th>Status</th><th>Total</th><th></th></tr>
                <tr th:each="o : ${recentOrders}">
                    <td th:text="${#strings.substring(o.reference.toString(), 0, 8)} + '…'"></td>
                    <td th:text="${o.fullName}"></td>
                    <td><span th:class="'badge badge-' + ${o.status.name().toLowerCase()}" th:text="${o.status}"></span></td>
                    <td th:text="'R' + ${o.total}"></td>
                    <td><a th:href="@{'/admin/orders/' + ${o.id}}">View →</a></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
