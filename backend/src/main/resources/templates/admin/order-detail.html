<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order — GuardPulse admin</title>
    <th:block th:replace="admin/fragments :: styles"></th:block>
</head>
<body>
    <div th:replace="admin/fragments :: nav('orders')"></div>
    <div class="wrap">
        <p class="muted"><a href="/admin/orders">← All orders</a></p>
        <h1>Order <span th:text="${order.reference}"></span></h1>

        <div class="card">
            <strong>Status</strong>
            <form method="post" th:action="@{'/admin/orders/' + ${order.id} + '/status'}" style="margin-top:12px; display:flex; gap:10px; align-items:flex-end;">
                <div style="flex-grow:1; margin-bottom:0;">
                    <label for="status">Update status</label>
                    <select id="status" name="status" style="margin-bottom:0;">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == order.status}"></option>
                    </select>
                </div>
                <button type="submit" class="primary">Save</button>
            </form>
        </div>

        <div class="card">
            <strong>Customer</strong>
            <p style="margin:10px 0 0;" th:text="${order.fullName}"></p>
            <p class="muted" th:text="${order.email} + ' · ' + ${order.phone}"></p>
        </div>

        <div class="card">
            <strong>Shipping address</strong>
            <p style="margin:10px 0 0;">
                <span th:text="${order.addressLine1}"></span><span th:if="${order.addressLine2}" th:text="', ' + ${order.addressLine2}"></span><br>
                <span th:text="${order.city} + ', ' + ${order.province} + ' ' + ${order.postalCode}"></span>
            </p>
        </div>

        <div class="card">
            <strong>Items</strong>
            <table style="margin-top:12px;">
                <tr><th>Product</th><th>Qty</th><th>Unit price</th><th>Subtotal</th></tr>
                <tr th:each="item : ${order.items}">
                    <td th:text="${item.productName}"></td>
                    <td th:text="${item.quantity}"></td>
                    <td th:text="'R' + ${item.unitPrice}"></td>
                    <td th:text="'R' + ${item.subtotal}"></td>
                </tr>
            </table>
            <p style="text-align:right; margin-top:14px;">
                <span class="muted">Shipping: R<span th:text="${order.shippingFee}"></span></span><br>
                <strong style="font-size:18px;">Total: R<span th:text="${order.total}"></span></strong>
            </p>
        </div>
    </div>
</body>
</html>
